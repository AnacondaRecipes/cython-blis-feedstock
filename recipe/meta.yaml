{% set name = "blis" %}
{% set version = "1.3.4" %}

package:
  name: cython-{{ name }}
  version: {{ version }}

source:
  url: https://github.com/explosion/cython-{{ name }}/archive/refs/tags/release-v{{ version }}.tar.gz
  sha256: 0dea6eadb7e9ffdb7717e21b4887be66a56945dbb8ba4f8e6cb81bd766b88af4

build:
  number: 0
  skip: true  # [py<39 or py>315]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - clangdev  # [win]
  host:
    - pip
    - python
    - setuptools
    - cython >=3.1,<4.0
    - numpy {{ numpy }}
  run:
    - python
    - numpy {{ numpy }}

test:
  source_files:
    - tests
  imports:
    - blis
    - blis.py
    - blis.cy
  commands:
    - pip check
    - pytest --tb=native tests/
  requires:
    - pip
    - pytest
    - hypothesis >=4.0.0,<7.0.0

about:
  home: https://github.com/explosion/cython-blis
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
  summary: Fast matrix-multiplication as a self-contained Python library - no system dependencies!
  description: |
    cython-blis provides the Blis linear algebra routines as a self-contained Python C-extension.
  doc_url: https://github.com/explosion/cython-blis/blob/master/README.md
  dev_url: https://github.com/explosion/cython-blis

extra:
  recipe-maintainers:
    - honnibal
    - ines
  skip-lints:
    - should_use_stdlib
